name: Paper compatibility

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Unit tests and release jar
        run: bash gradlew --no-configuration-cache test shadowJar
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
      - name: Upload release jar
        uses: actions/upload-artifact@v4
        with:
          name: BetterRTP
          path: build/libs/*.jar
          if-no-files-found: error

  paper:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { paper: '1.18.2', java: '17' }
          - { paper: '1.19.4', java: '17' }
          - { paper: '1.20.4', java: '17' }
          - { paper: '1.20.6', java: '21' }
          - { paper: '1.21.1', java: '21' }
          - { paper: '1.21.11', java: '21' }
          - { paper: '26.1.2', java: '25' }
          - { paper: '26.2', java: '25' }
          - { paper: '26.3', java: '25' }
    name: Paper ${{ matrix.paper }} (Java ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BetterRTP
          path: build/libs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Server smoke test
        run: python3 scripts/smoke-paper.py '${{ matrix.paper }}' '${{ matrix.java }}'
